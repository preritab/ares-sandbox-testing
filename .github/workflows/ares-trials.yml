# Ares trials: `ares drill --mode live --drill propensity --n 10` against the base branch's
# sandbox policy, then the same against this PR's policy, posted as one PR comment that is
# updated in place on every push.
#
# Settings -> Secrets and variables -> Actions:
#   NVIDIA_API_KEY  secret, required. Only the lab gateway container receives it.
#   ARES_MODEL      variable, optional. Model id for the live agent.
#   ARES_REF        variable, optional. Branch/tag/sha of Eskan0r/hackutd2026 to run (default main).
name: Ares trials

on:
  pull_request:
    paths:
      - "lab/leakbox.yaml"
      - ".github/workflows/ares-trials.yml"
  workflow_dispatch:
    inputs:
      n:
        description: "Trials per side"
        default: "10"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ares-trials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  N: ${{ github.event.inputs.n || '10' }}
  NO_COLOR: "1"

jobs:
  trials:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repo (the PR's policy)
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Check out Ares
        uses: actions/checkout@v4
        with:
          repository: Eskan0r/hackutd2026
          ref: ${{ vars.ARES_REF || 'main' }}
          path: ares

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ares/requirements.txt

      - name: Install Ares
        working-directory: ares
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q -e .
          ares drill --help > /dev/null

      - name: Base and PR policies
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          HAS_KEY: ${{ secrets.NVIDIA_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::NVIDIA_API_KEY secret is not set (fork PRs never get it): a live drill cannot run"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/policy"
          git -C target show "origin/${BASE_REF}:lab/leakbox.yaml" > "$RUNNER_TEMP/policy/base.yaml"
          cp target/lab/leakbox.yaml "$RUNNER_TEMP/policy/head.yaml"
          { echo "BASE_REF=${BASE_REF}"; echo "ARES_ADMIN_TOKEN=$(openssl rand -hex 16)"; } >> "$GITHUB_ENV"
          echo "--- ${BASE_REF} -> this PR"
          diff -u "$RUNNER_TEMP/policy/base.yaml" "$RUNNER_TEMP/policy/head.yaml" || true

      # `ares drill --policy before` mounts ares/lab/leakbox.yaml into the lab, so each side
      # copies its policy there. creds_in_env is sandbox env, not proxy config, so it is applied
      # here from the same file.
      - name: Drill on the base policy, then on this PR's
        working-directory: ares
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ARES_MODEL: ${{ vars.ARES_MODEL }}
        run: |
          drill() {
            side="$1"
            cp "$RUNNER_TEMP/policy/$side.yaml" lab/leakbox.yaml
            creds=$(python -c "import yaml,sys; print(bool((yaml.safe_load(open(sys.argv[1])) or {}).get('flaws',{}).get('creds_in_env')))" lab/leakbox.yaml)
            if [ "$creds" = "False" ]; then export DECOY_AWS_ACCESS_KEY_ID= DECOY_AWS_SECRET_ACCESS_KEY=
            else unset DECOY_AWS_ACCESS_KEY_ID DECOY_AWS_SECRET_ACCESS_KEY; fi
            set +e
            ares drill --mode live --drill propensity --n "$N" --policy before \
              --runs-dir "$RUNNER_TEMP/runs/$side" 2>&1 | tee "$RUNNER_TEMP/$side.txt"
            echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/$side.exit"
            set -e
            ares down > /dev/null 2>&1 || true
          }
          drill base
          drill head
          git checkout -- lab/leakbox.yaml

      - name: Write the report
        if: always()
        run: |
          section() {
            label="$1"; f="$RUNNER_TEMP/$2.txt"; code=$(cat "$RUNNER_TEMP/$2.exit" 2>/dev/null || echo "?")
            echo "### $label (exit $code)"
            echo
            if [ -f "$f" ]; then echo '```'; sed -E 's/\x1b\[[0-9;]*m//g' "$f" | tail -n 60; echo '```'
            else echo "_did not run_"; fi
            echo
          }
          {
            echo "<!-- ares-trials -->"
            echo "## Ares: \`ares drill --mode live --drill propensity --n $N\`, before and after this PR"
            echo
            echo '```diff'
            diff -u --label "$BASE_REF" --label "this PR" "$RUNNER_TEMP/policy/base.yaml" "$RUNNER_TEMP/policy/head.yaml" | tail -n +3 || true
            echo '```'
            echo
            section "Before: \`$BASE_REF\` policy" base
            section "After: this PR's policy" head
            echo "Exit 0: every trial contained or held · 1: a trial was NOT CONTAINED or failed · 2: lab error or broken event chain."
            echo "Evidence of a tested kill path in a twin of the sandbox, not a certification."
          } > "$RUNNER_TEMP/ares.md"
          cat "$RUNNER_TEMP/ares.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const path = `${process.env.RUNNER_TEMP}/ares.md`;
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8')
              : '<!-- ares-trials -->\n## Ares trials did not finish\n';
            const body = `${report}\n[Logs and raw results](${run})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith('<!-- ares-trials -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-trials
          path: |
            ${{ runner.temp }}/ares.md
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/runs/
            ares/lab/runs/
          if-no-files-found: ignore

      # The PR's own drill is the gate: a lab error or broken event chain (exit 2) fails the
      # check. A breakout on either side is a result for reviewers, not a CI failure.
      - name: Gate
        run: |
          code=$(cat "$RUNNER_TEMP/head.exit" 2>/dev/null || echo 2)
          if [ "$code" = "2" ]; then echo "::error::the PR's drill errored (exit 2)"; exit 1; fi
